[package]
name = "relopin-core"
version = "0.1.0"
edition = "2021"

# عمداً: لا توجد أي [dependencies] — هذا المطلوب (صفر اعتماديات خارجية).
# كل التشفير والهاش والـ PRNG منفّذ يدويًا في src/ باستخدام std فقط.

[[bin]]
name = "relopin-core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
